name: Publish to MCP Registry

# Publishes server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub Actions OIDC — no
# secrets or accounts required; the io.github.trajectiq-ai/* namespace is
# granted because the workflow runs inside this repository.
#
# Runs on every release tag (version stamped from the tag) and on
# manual dispatch (version read from server.json).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish server.json to registry.modelcontextprotocol.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # GitHub OIDC for `mcp-publisher login github-oidc`
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Pinned release, verified against its published checksum before use.
      # To upgrade: bump the version and take the linux_amd64 line from that
      # release's registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: '1.8.1'
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSLf -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # The tag, package.json and server.json must agree: registry versions
      # are immutable, so a mismatch would publish the wrong metadata for good.
      - name: Check versions match the release tag (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          PKG=$(jq -r '.version' package.json)
          SRV=$(jq -r '.version' server.json)
          SRV_PKG=$(jq -r '.packages[0].version // .version' server.json)
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRV" ] || [ "$TAG" != "$SRV_PKG" ]; then
            echo "::error::tag v$TAG, package.json $PKG, server.json $SRV / $SRV_PKG must all match"
            exit 1
          fi

      - name: Authenticate to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json (idempotent, retries registry 5xx)
        run: |
          NAME=$(jq -r '.name' server.json)
          VERSION=$(jq -r '.version' server.json)
          # Unique search token = the namespace owner ("trajectiq-ai").
          SEARCH=$(printf '%s' "$NAME" | sed -e 's|^io\.github\.||' -e 's|/.*$||')

          # Skip when this exact name@version is already listed. Fail open:
          # if the registry API is unreachable, attempt the publish anyway.
          # The registry is slow enough that a single 20s call flakes, so retry.
          EXISTING=$(curl -sS --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors \
              "https://registry.modelcontextprotocol.io/v0/servers?search=$SEARCH" 2>/dev/null \
            | jq -r --arg n "$NAME" --arg v "$VERSION" \
                '[.servers[]? | select(.server.name == $n and .server.version == $v)] | length' 2>/dev/null || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "0" ]; then
            echo "Already published: $NAME@$VERSION — skipping."
            exit 0
          fi
          if [ -z "$EXISTING" ]; then
            echo "Registry lookup unavailable — attempting publish anyway."
          fi

          set +e
          OUTPUT=$(./mcp-publisher publish 2>&1)
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$OUTPUT" | grep -qE 'status 5[0-9][0-9]'; then
            echo "Registry 5xx during publish — retrying once in 15s."
            sleep 15
            ./mcp-publisher publish
          elif printf '%s' "$OUTPUT" | grep -q 'cannot publish duplicate version'; then
            # Registry versions are immutable, so re-publishing name@version to
            # refresh its description/title is a no-op, not a failure. Say so
            # loudly: the metadata edit only ships with the next version bump.
            echo "::notice title=MCP Registry::$NAME@$VERSION already exists; registry versions are immutable, so updated metadata in server.json publishes on the next version bump."
            exit 0
          else
            exit "$STATUS"
          fi

      - name: Show published entry
        run: |
          curl -sSL --max-time 30 "https://registry.modelcontextprotocol.io/v0/servers?search=trajectiq" \
            | jq '.servers[] | select(.server.name == "io.github.trajectiq-ai/E2E") | .server | {name, title, version, websiteUrl, status: ._meta["io.modelcontextprotocol.registry/official"].status}'
