name: Deploy to Vercel

# Ships the hosted MCP endpoint only after CI is green on main, so a red build
# never reaches https://playwright-e2e-mcp.vercel.app/api/mcp.
#
# Vercel's own Git integration (vercel git connect) would give PR previews too,
# but it requires linking GitHub to the Vercel account interactively.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize deployments so an older commit can never land after a newer one.
concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Link the Vercel project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"%s"}' \
            'prj_Vr5hQ9suaB2Ef8j98jZLU51ZI72K' \
            'team_DqQiXMgH6SQxhk6c52ooLKei' \
            'playwright-e2e-mcp' > .vercel/project.json

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx -y vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
