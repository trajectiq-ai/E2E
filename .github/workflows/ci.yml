name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium (with system deps)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Run integration suite
        run: npm run e2e

  mcpb:
    name: mcpb bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The bundle is built and driven on both platforms; the two hashes are
        # compared by mcpb-reproducible below.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the bundle and drive it with a real MCP client
        run: npm run mcpb:smoke
      - name: Record the hash of the bundle this platform built
        shell: bash
        run: |
          node -e "
            const { createHash } = require('node:crypto');
            const { readFileSync } = require('node:fs');
            const pkg = require('./package.json');
            const name = pkg.name + '-' + pkg.version + '.mcpb';
            const hash = createHash('sha256').update(readFileSync(name)).digest('hex');
            console.log(hash + '  ' + name);
          " | tee bundle.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcpb-hash-${{ runner.os }}
          path: bundle.sha256
          if-no-files-found: error
          retention-days: 1

  # A reproducible bundle has to hash the same wherever it is built, so the
  # archive never depends on the machine that produced it. Each platform above
  # records the hash of what it built; this job fails unless they agree.
  mcpb-reproducible:
    name: mcpb reproducible across platforms
    needs: mcpb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mcpb-hash-*
          path: hashes
      - name: Compare every platform's hash
        shell: bash
        run: |
          mapfile -t files < <(find hashes -name bundle.sha256 | sort)
          if [ "${#files[@]}" -lt 2 ]; then
            echo "::error::expected one hash per platform, found ${#files[@]}"
            exit 1
          fi
          expected=''
          for file in "${files[@]}"; do
            echo "--- $file"
            cat "$file"
            hash=$(awk '{ print $1 }' "$file")
            if [ -z "$hash" ]; then
              echo "::error::$file recorded no hash"
              exit 1
            fi
            if [ -z "$expected" ]; then
              expected="$hash"
            elif [ "$hash" != "$expected" ]; then
              echo "::error::$file hashed $hash but another platform hashed $expected - the bundle is not reproducible across platforms"
              exit 1
            fi
          done
          echo "::notice title=mcpb::every platform produced the same bundle: $expected"

  pack:
    name: npm pack dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run

  audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
